name: Build Backend Image

on:
  push:
    branches: [master]
    paths:
      - 'dailyWins-service/**'
      - '.github/workflows/build-backend-image.yml'
  workflow_dispatch:

concurrency:
  group: image-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docker:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dailywins-service" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch,suffix=-{{sha}}
            type=sha,prefix=sha-
      # Both Dockerfiles run their project tests before producing the runtime image.
      - name: Test, build and publish
        uses: docker/build-push-action@v6
        id: build
        with:
          context: ./dailyWins-service
          file: ./dailyWins-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Published images
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## Published Images'
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              printf -- '- `%s`\n' "$tag"
            done <<< "$IMAGE_TAGS"
            echo
            echo '## Deploy Commands'
            echo '在服务器的项目部署目录执行：'
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              printf -- '- `./deploy.sh %s`\n' "$tag"
            done <<< "$IMAGE_TAGS"
            printf '\nImage digest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
